<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio en création</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #0b0d10;
            --text: #f5f5f5;
            --muted: #9ca3af;
            --accent: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            background: var(--background);
            color: var(--text);
            overflow: hidden;
        }

        /* Fond décoratif */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.035);
            filter: blur(80px);

            top: -200px;
            right: -150px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.025);
            filter: blur(80px);

            bottom: -200px;
            left: -150px;

            pointer-events: none;
        }

        main {
            width: min(90%, 720px);
            text-align: center;

            opacity: 0;
            transform: translateY(20px);

            animation: fadeIn 1s ease forwards;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 28px;
            padding: 8px 14px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;

            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.04em;

            background: rgba(255, 255, 255, 0.025);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;

            background: #6ee7b7;
            box-shadow: 0 0 12px rgba(110, 231, 183, 0.7);

            animation: pulse 2s infinite;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1.05;
            letter-spacing: -0.045em;
            font-weight: 700;

            margin-bottom: 24px;
        }

        p {
            max-width: 560px;
            margin: 0 auto;

            color: var(--muted);
            font-size: clamp(16px, 2vw, 18px);
            line-height: 1.7;
        }

        .line {
            width: 50px;
            height: 1px;

            margin: 40px auto 0;

            background: rgba(255, 255, 255, 0.25);
        }

        footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;

            text-align: center;

            color: #555b65;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.8);
            }
        }

        /* Accessibilité : désactive les animations si l'utilisateur
           préfère réduire les mouvements */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            main {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="status">
            <span class="status-dot"></span>
            Portfolio en cours de création
        </div>

        <h1>Portfolio en création.</h1>

        <p>
            Je travaille actuellement sur un nouvel espace pour présenter
            mes projets, mon parcours et mon univers. Le portfolio sera
            bientôt disponible.
        </p>

        <div class="line"></div>
    </main>

    <footer>
        &copy; <span id="year"></span> — Portfolio
    </footer>

    <script>
        // Mise à jour automatique de l'année
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
